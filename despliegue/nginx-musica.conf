# Entrada pública de Música en el nginx del servidor.
# Copiar a /etc/nginx/sites-available/musica-https.conf, enlazar en sites-enabled y ejecutar certbot
# (ver DEPLOY.md): certbot agrega el bloque 443 con el certificado y la redirección de HTTP a HTTPS.
# La aplicación exige HTTPS: sin él, el navegador no ofrece crypto.subtle ni crypto.randomUUID y no
# deja ingresar.
server {
    listen 80;
    server_name musica.148-230-73-226.sslip.io;

    # Importación de respaldos: el sistema admite hasta 240 MB.
    client_max_body_size 250m;

    location / {
        proxy_pass http://127.0.0.1:5092;
        # $http_host conserva el puerto si lo hay: el servidor compara Origin con Host y rechaza
        # los envíos si no coinciden.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se agrega) porque el servidor limita los intentos de ingreso por
        # el primer valor de esta cabecera; si el cliente pudiera fijarlo, evadiría el límite.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Respaldos, PDF y restauraciones pueden tardar.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
