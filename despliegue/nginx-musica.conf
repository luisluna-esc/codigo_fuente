# Entrada pública de Música en el nginx del servidor.
# Copiar a /etc/nginx/sites-available/musica.conf y enlazar en sites-enabled.
server {
    listen 8092;
    server_name _;

    # Importación de respaldos: el sistema admite hasta 240 MB.
    client_max_body_size 250m;

    location / {
        proxy_pass http://127.0.0.1:5092;
        # $http_host conserva el puerto: el servidor compara Origin con Host y rechaza
        # los envíos si no coinciden.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se agrega) porque el servidor limita los intentos de ingreso por
        # el primer valor de esta cabecera; si el cliente pudiera fijarlo, evadiría el límite.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Respaldos, PDF y restauraciones pueden tardar.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
